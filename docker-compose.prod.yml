services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://auto.aipixel.uz}
    container_name: shifokor-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4300:3000"
    volumes:
      - shifokor_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: shifokor-telegram-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - shifokor_data:/app/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  shifokor_data:
